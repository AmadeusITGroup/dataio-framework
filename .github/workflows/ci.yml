name: "CI"

on:
  push:
    branches: [ "main" ]
    paths-ignore: ["docs/**", "**/*.md", "**/LICENSE", "**/.gitignore"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md", "**/LICENSE", "**/.gitignore"]
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Every supported Spark line has to keep building, so don't hide one line's failure behind
      # another's.
      fail-fast: false
      matrix:
        include:
          # Must stay in step with the profiles in project/SparkProfile.scala, `java` included: the
          # build checks the running JDK against the profile and fails fast, so drift is caught here.
          - spark_profile: "3.5.0"
            java: 8
    env:
      SPARK_PROFILE: ${{ matrix.spark_profile }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}
          cache: "sbt"

      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.10.11

      - run: sbt compile

      - run: sbt test

      - run: sbt package

      - run: tar cf artefacts.tar target/ */target/

      - uses: actions/upload-artifact@v4
        with:
          name: Artefacts-spark${{ matrix.spark_profile }}
          path: artefacts.tar
