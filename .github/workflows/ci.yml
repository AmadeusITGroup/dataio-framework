name: "CI"

on:
  push:
    branches: [ "main" ]
    paths-ignore: ["docs/**", "**/*.md", "**/LICENSE", "**/.gitignore"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md", "**/LICENSE", "**/.gitignore"]
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - spark_profile: spark34
            java_version: "11"
            label: "Spark 3.4 / Java 11"
          - spark_profile: spark35
            java_version: "11"
            label: "Spark 3.5 / Java 11"
          - spark_profile: spark40
            java_version: "17"
            label: "Spark 4.0 / Java 17"

    name: "Build (${{ matrix.label }})"

    env:
      SPARK_PROFILE: ${{ matrix.spark_profile }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java_version }}
          cache: "sbt"

      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.10.11

      - name: Compile
        run: sbt compile

      - name: Test
        run: sbt test

      - name: Package
        run: sbt package

      - name: Bundle artifacts
        run: tar cf artefacts.tar target/ */target/

      - uses: actions/upload-artifact@v4
        with:
          name: Artefacts-${{ matrix.spark_profile }}
          path: artefacts.tar
